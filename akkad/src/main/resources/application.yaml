spring:
  application:
    name: akkad
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://127.0.0.1:5432/your_db_name?currentSchema=public
    username: postgres
    password: your_password
    hikari:
      maximum-pool-size: 15

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: self.syhong.akkad.domain.do
  global-config:
    db-config:
      # 全局主键类型，推荐使用雪花算法 (ASSIGN_ID) 或自增 (AUTO)
      id-type: assign_id 
      # 逻辑删除全局配置（可选）
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  configuration:
    # 开启驼峰命名自动映射
    map-underscore-to-camel-case: true
    # 开发环境下开启 SQL 打印
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl