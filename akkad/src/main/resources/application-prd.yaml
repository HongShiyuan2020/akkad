spring:
  application:
    name: akkad
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://postgres:5432/akkad?currentSchema=public
    username: akkad
    password: <PASSWORD>
    hikari:
      maximum-pool-size: 15

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: self.syhong.akkad.domain.entity
  global-config:
    db-config:
      id-type: auto 
      # 逻辑删除全局配置（可选）
      # logic-delete-field: deleted
      # logic-delete-value: 1
      # logic-not-delete-value: 0
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl