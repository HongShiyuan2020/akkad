name: Akkad Build and Deploy

on:
  push:
    branches: ["master"]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # - name: Set up JDK 21
      #   uses: actions/setup-java@v4
      #   with:
      #     java-version: "21"
      #     distribution: "temurin"
      #     cache: "maven"

      # - name: Build Backend
      #   run: mvn clean package -DskipTests -f akkad/pom.xml

      # - name: Set up Node.js
      #   uses: actions/setup-node@v4
      #   with:
      #     node-version: "22"
      #     cache: "npm"
      #     cache-dependency-path: akkad-ui/package-lock.json

      # - name: Build Frontend
      #   run: |
      #     cd akkad-ui
      #     npm ci
      #     npm run build

      - name: Prepare Deploy Directory
        run: |
          rm -rf deploy && mkdir -p deploy

          cp compose.yaml deploy/
          
          cp .env          deploy/
          sed -i "s/POSTGRES_USER=.*/POSTGRES_USER=${{ secrets.POSTGRES_USER }}/g" deploy/.env
          sed -i "s/POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}/g" deploy/.env
          sed -i "s/NC_AUTH_JWT_SECRET=.*/NC_AUTH_JWT_SECRET=${{ secrets.NC_AUTH_JWT_SECRET }}/g" deploy/.env
          sed -i "s/NC_DB_PASSWORD/${{ secrets.NC_DB_PASSWORD }}/g" deploy/.env

          cp -r certs      deploy/
          cp -r nginx      deploy/
          cp -r sql        deploy/
          sed -i "s/<PASSWORD>/${{ secrets.NC_DB_PASSWORD }}/g" deploy/sql/init-db.sql

      - name: Clear Environment
        uses: appleboy/ssh-action@master
        with: 
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || '22' }}
          script: |
            cd /home/syhong/prds/akkad
            podman compose down --remove-orphans || true

            rm -rf nginx

      - name: SCP to Server
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || '22' }}
          source: "deploy/*"
          target: "/home/syhong/prds/akkad/"
          strip_components: 1

      - name: Restart Services
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || '22' }}
          script: |
            cd /home/syhong/prds/akkad

            podman compose up -d

            # Health check
            sleep 5
            podman compose ps
