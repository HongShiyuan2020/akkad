version: "3.9"

services:
  nginx:
    image: nginx:alpine
    container_name: nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./certs/drrr-sy.top:/etc/nginx/certs/drrr-sy.top:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:Z
      - ./nginx/html:/usr/share/nginx/html:Z
      - ./nginx/logs:/var/log/nginx:Z
      - ./nginx/stream.d:/etc/nginx/stream.d:Z
    depends_on:
      - adminer
      - hermes
  
  hermes:
    image: nousresearch/hermes-agent
    container_name: hermes
    restart: unless-stopped
    volumes:
      - ./hermes/.hermes:/opt/data:z
    command: gateway run
    # environment:
      # - HERMES_DASHBOARD=1

  postgres:
    image: postgres:18-alpine
    container_name: postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./sql/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:Z
      - postgres-data:/var/lib/postgresql:Z

  nocodb:
    image: nocodb/nocodb:latest
    container_name: nocodb-app
    restart: always
    environment:
      NC_DB: "pg://postgres:5432?u=nocodb&p=${NC_DB_PASSWORD}&d=nocodb"
      NC_AUTH_JWT_SECRET: ${NC_AUTH_JWT_SECRET}
      NC_PUBLIC_URL: "https://nocodb.drrr-sy.top"
    volumes:
      - nocodb_app_data:/usr/app/data:Z
    depends_on:
      - postgres

  # 
  # app:
  #   build: ./akkad
  #   container_name: akkad-app
  #   restart: always
  #   expose:
  #     - "8080"
  #   environment:
  #     SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-akkad}
  #     SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
  #     SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
  #   depends_on:
  #     postgres:
  #       condition: service_started

  # adminer:
  #   image: adminer:standalone
  #   container_name: adminer
  #   restart: always

volumes:
  postgres-data:
  nocodb_app_data:
