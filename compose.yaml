version: "3.9"

services:
  nginx:
    image: nginx:alpine
    container_name: nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./certs/drrr-sy.top:/etc/nginx/certs/drrr-sy.top:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:Z
      - ./nginx/html:/usr/share/nginx/html:Z
      - ./static:/usr/share/nginx/static:Z
      - ./nginx/logs:/var/log/nginx:Z
      - ./nginx/stream.d:/etc/nginx/stream.d:Z
    depends_on:
      - adminer
      - hermes
  
  hermes:
    image: nousresearch/hermes-agent
    container_name: hermes
    restart: unless-stopped
    volumes:
      - ./hermes/.hermes:/opt/data:z
    command: gateway run

  postgres:
    image: postgres:18-alpine
    container_name: postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - ./sql/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:Z
      - postgres-data:/var/lib/postgresql:Z

  cloudbeaver:
    image: dbeaver/cloudbeaver:latest
    container_name: cloudbeaver
    restart: unless-stopped
    volumes:
      - ./cloudbeaver/workspace:/opt/cloudbeaver/workspace:Z

  # 
